  .signout-btn{

  }
  .signout-btn:hover{ color:var(--text); }
  .signout-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .sync-bar{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:7px;
    padding:0 0 12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--text-muted);
  }
  .sync-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--border);
    flex:none;
    transition:background .2s ease;
  }
  .sync-dot.on{ background:#3fae62; }
  .sync-dot.busy{ background:#d9a11f; }
  .sync-dot.err{ background:#d1453b; }
</style>

  var HERO_SVG = '<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Gym floor with a loaded barbell">'

  var data = {};
  var syncStatus = 'loading';
  var syncError = null;
  var lastSyncAt = null;

  function fieldKey(programKey, exIndex, setIndex){
    return programKey + ':' + exIndex + ':' + setIndex;
  }

  function formatSyncTime(d){
    var datePart = d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
    var timePart = d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
    return datePart + ' at ' + timePart;
  }

  function setSyncStatus(status, message){
    syncStatus = status;
    syncError = message || null;
    if(status === 'on') lastSyncAt = new Date();
    updateSyncUI();
  }

  function syncStatusInfo(){
    if(syncStatus === 'saving') return { text:'Saving…', cls:'busy' };
    if(syncStatus === 'loading') return { text:'Loading your log…', cls:'busy' };
    if(syncStatus === 'error') return { text:'Sync failed' + (syncError ? ' — ' + syncError : ''), cls:'err' };
    if(lastSyncAt) return { text:'Last synced ' + formatSyncTime(lastSyncAt), cls:'on' };
    return { text:'Not synced yet', cls:'' };
  }

  function updateSyncUI(){
    var dot = document.getElementById('syncDot');
    var label = document.getElementById('syncLabel');
    if(!dot || !label) return;
    var st = syncStatusInfo();
    dot.classList.remove('on','busy','err');
    if(st.cls) dot.classList.add(st.cls);
    label.textContent = st.text;
  }

  function loadRemoteData(){
    setSyncStatus('loading');
    return sb.from('weight_logs').select('program,exercise_index,set_index,weight').then(function(res){
      if(res.error){
        data = {};
        setSyncStatus('error', res.error.message);
        return;
      }
      data = {};
      (res.data || []).forEach(function(row){
        data[fieldKey(row.program, row.exercise_index, row.set_index)] = String(row.weight);
      });
      setSyncStatus('on');
    });
  }

  function saveField(programKey, exIndex, setIndex, value){
    var k = fieldKey(programKey, exIndex, setIndex);
    setSyncStatus('saving');
    if(value === '' || value === undefined){
      delete data[k];
      return sb.from('weight_logs').delete().match({
        user_id: session.user.id, program: programKey, exercise_index: exIndex, set_index: setIndex
      }).then(function(res){
        if(res.error) setSyncStatus('error', res.error.message); else setSyncStatus('on');
      });
    }else{
      data[k] = value;
      return sb.from('weight_logs').upsert({
        user_id: session.user.id,
        program: programKey,
        exercise_index: exIndex,
        set_index: setIndex,
        weight: value,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id,program,exercise_index,set_index' }).then(function(res){
        if(res.error) setSyncStatus('error', res.error.message); else setSyncStatus('on');
      });
    }
  }

  function clearProgram(programKey){
    setSyncStatus('saving');
    return sb.from('weight_logs').delete().match({ user_id: session.user.id, program: programKey }).then(function(res){
      if(res.error) setSyncStatus('error', res.error.message); else setSyncStatus('on');
    });
  }

  var view = document.getElementById('view');
  var topbarLeft = document.getElementById('topbarLeft');
  var topbarRight = document.getElementById('topbarRight');

  function el(tag, attrs, children){
    var node = document.createElement(tag);
    attrs = attrs || {};
    for(var k in attrs){
      if(k === 'class') node.className = attrs[k];
      else if(k === 'html') node.innerHTML = attrs[k];
      else if(k.indexOf('on') === 0) node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function(c){
      if(c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  var GOOGLE_LOGO = '<svg viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/></svg>';

  function renderChecking(){
    topbarLeft.innerHTML = '';
    topbarLeft.appendChild(el('div',{class:'brand'},['PUSH', el('span',{class:'slash'},['/']), 'PULL']));
    topbarRight.innerHTML = '';
    view.innerHTML = '';
    view.appendChild(el('p',{class:'auth-status'},['Checking your session…']));
  }

  function renderSignIn(){
    document.documentElement.style.setProperty('--accent', 'var(--text-muted)');
    topbarLeft.innerHTML = '';
    topbarLeft.appendChild(el('div',{class:'brand'},['PUSH', el('span',{class:'slash'},['/']), 'PULL']));
    topbarRight.innerHTML = '';

    var wrap = el('div',{});
    var banner = el('div',{class:'hero-banner'},[]);
    banner.innerHTML = HERO_SVG;
    banner.appendChild(el('div',{class:'hero-overlay'},[
      el('span',{class:'eyebrow'},['Push pull']),
      el('h1',{},['Your gym log, everywhere'])
    ]));
    wrap.appendChild(banner);

    wrap.appendChild(el('div',{class:'auth-copy'},[
      el('h1',{},['Sign in to start logging']),
      el('p',{},['Connect your Google account and your weights sync automatically across every device you train from.'])
    ]));

    var btn = el('button',{class:'google-btn', type:'button', onclick:function(){
      sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: window.location.href } });
    }},[]);
    btn.innerHTML = GOOGLE_LOGO + '<span>Continue with Google</span>';
    wrap.appendChild(btn);

    view.innerHTML = '';
    view.appendChild(wrap);
  }

  function renderLanding(){
    document.documentElement.style.setProperty('--accent', 'var(--text-muted)');
    topbarLeft.innerHTML = '';
    topbarLeft.appendChild(el('div',{class:'brand'},['PUSH', el('span',{class:'slash'},['/']), 'PULL']));
    topbarRight.innerHTML = '';
    topbarRight.appendChild(el('button',{class:'signout-btn', type:'button', onclick:function(){
      sb.auth.signOut();
    }},['Sign out']));

    var wrap = el('div',{});
    var banner = el('div',{class:'hero-banner'},[]);
    banner.innerHTML = HERO_SVG;
    banner.appendChild(el('div',{class:'hero-overlay'},[
      el('span',{class:'eyebrow'},['Welcome back']),
      el('h1',{},['Ready to lift?']),
      el('p',{},['Two programs, six lifts each. Pick your session and log every set as you go — we’ll remember it for next time.'])
    ]));
    wrap.appendChild(banner);

    var grid = el('div',{class:'program-grid'});
    ['push','pull'].forEach(function(key){
      var p = PROGRAMS[key];
      var filled = countFilled(p);
      var total = totalSets(p);
      var card = el('button',{class:'program-card', 'data-p':key, type:'button', onclick:function(){ openProgram(key); }},[
        el('span',{class:'tag'},[p.tag]),
        el('h2',{},[p.name]),
        el('p',{class:'desc'},[p.desc]),
        el('div',{class:'meta'},[
          el('span',{},[p.exercises.length + ' exercises · ' + total + ' sets']),
          el('span',{class:'go'},[filled > 0 ? (filled + '/' + total + ' logged') : 'Start →'])
        ])
      ]);
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    view.innerHTML = '';
    view.appendChild(wrap);
  }

  function totalSets(p){
    return p.exercises.reduce(function(sum, ex){ return sum + ex.sets; }, 0);
  }
  function countFilled(p){
    var n = 0;
    p.exercises.forEach(function(ex, exIndex){
      for(var s=0; s<ex.sets; s++){
        var v = data[fieldKey(p.key, exIndex, s)];
        if(v !== undefined && v !== '') n++;
      }
    });
    return n;
  }

  function openProgram(key){
    var p = PROGRAMS[key];
    document.documentElement.style.setProperty('--accent', 'var(--accent-' + key + ')');
    document.documentElement.style.setProperty('--accent-soft', 'var(--accent-' + key + '-soft)');

    topbarLeft.innerHTML = '';
    topbarLeft.appendChild(el('button',{class:'back-btn', type:'button', onclick:renderLanding},['← Programs']));
    topbarRight.innerHTML = '';
    topbarRight.appendChild(el('button',{class:'reset-btn', type:'button', onclick:function(){
      if(confirm('Clear all logged weights for ' + p.name + '?')){
        p.exercises.forEach(function(ex, exIndex){
          for(var s=0; s<ex.sets; s++){ delete data[fieldKey(p.key, exIndex, s)]; }
        });
        clearProgram(key).then(function(){ openProgram(key); });
      }
    }},['Clear log']));

    var wrap = el('div',{});
    wrap.appendChild(el('div',{class:'workout-head'},[
      el('span',{class:'tag'},[p.tag]),
      el('h1',{},[p.name + ' Day']),
      el('p',{},[p.desc])
    ]));

    var list = el('div',{class:'exercise-list'});
    p.exercises.forEach(function(ex, exIndex){
      var card = el('div',{class:'exercise-card', id:'ex-'+key+'-'+exIndex},[]);
      var top = el('div',{class:'exercise-top'},[
        el('div',{},[
          el('span',{class:'exercise-index'},['0' + (exIndex+1)]),
          el('div',{class:'exercise-name'},[ex.name]),
          el('div',{class:'exercise-sub'},[ex.reps + ' reps · ' + ex.sets + ' sets'])
        ]),
        el('div',{class:'check'},[el('span',{html:'<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 12L13 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'})])
      ]);
      card.appendChild(top);

      var row = el('div',{class:'set-row'});
      for(var s=0; s<ex.sets; s++){
        (function(s){
          var k = fieldKey(key, exIndex, s);
          var input = el('input',{
            type:'number',
            inputmode:'decimal',
            min:'0',
            step:'0.5',
            placeholder:'—',
            'aria-label': ex.name + ' set ' + (s+1) + ' weight'
          });
          if(data[k] !== undefined) input.value = data[k];
          input.addEventListener('input', function(){
            saveField(key, exIndex, s, input.value);
            updateCardState(card, p, exIndex);
          });
          var box = el('div',{class:'set-box'},[
            el('span',{class:'set-label'},['SET ' + (s+1)]),
            input,
            el('span',{class:'unit'},['kg'])
          ]);
          row.appendChild(box);
        })(s);
      }
      card.appendChild(row);
      updateCardState(card, p, exIndex);
      list.appendChild(card);
    });
    wrap.appendChild(list);
    wrap.appendChild(el('p',{class:'foot-note'},['Logged weights stay on this device.']));

    view.innerHTML = '';
    view.appendChild(wrap);
  }

  function updateCardState(card, p, exIndex){
    var ex = p.exercises[exIndex];
    var filled = 0;
    for(var s=0; s<ex.sets; s++){
      var v = data[fieldKey(p.key, exIndex, s)];
      if(v !== undefined && v !== '') filled++;
    }
    card.classList.toggle('done', filled === ex.sets);
  }

  function afterAuthResolved(){
    if(!session){
      renderSignIn();
    }else{
      loadRemoteData().then(renderLanding);
    }
  }

  renderChecking();
  sb.auth.onAuthStateChange(function(event, sess){
    session = sess;
    afterAuthResolved();
  });
  sb.auth.getSession().then(function(res){
    session = res.data.session;
    afterAuthResolved();
  });
})();
</script>
